<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EasyApply · Toolhub</title>
<style>
  :root { --bg:#F3F6F4; --card:#fff; --ink:#13241D; --muted:#5E7068; --accent:#0B7A55; --bad:#B4372A; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0D1512; --card:#15211C; --ink:#E6EEE9; --muted:#93A69C; --accent:#4FC796; --bad:#F08A7A; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:min(420px,100%); background:var(--card); border-radius:16px; padding:24px 20px; text-align:center;
    box-shadow:0 1px 2px rgba(0,0,0,.06), 0 12px 32px -18px rgba(0,0,0,.4); }
  .mark { width:44px; height:44px; margin:0 auto 12px; border-radius:12px; display:grid; place-items:center; background:var(--accent); color:#fff; font-weight:700; }
  h1 { font-size:18px; margin:0 0 6px; }
  p { margin:6px 0; color:var(--muted); font-size:14px; line-height:1.55; }
  .en { font-size:12.5px; }
  .bad h1 { color:var(--bad); }
  a.btn { display:inline-block; margin-top:14px; padding:10px 16px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">EA</div>
  <h1 id="title">EasyApply</h1>
  <p id="bn">এক মুহূর্ত…</p>
  <p class="en" id="en">One moment…</p>
  <a class="btn" id="open" href="./" hidden>EasyApply খুলুন · Open EasyApply</a>
</div>
<script type="module" src="js/bridge.js?v=1"></script>
</body>
</html>
